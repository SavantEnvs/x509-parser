[package]
name = "x509-parser-mayhem-fuzz"
version = "0.0.0"
authors = ["mayhem integration"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

# Additive cargo-fuzz crate (SPEC §6.2 item 9 / port-rust): upstream's own fuzz/Cargo.toml pins
# asn1-rs/oid-registry via [patch.crates-io] to git branches (asn1-rs@master,
# oid-registry@oid-registry-0.9) that no longer resolve (the oid-registry branch has since been
# deleted upstream), so `fuzz/` no longer builds. Rather than touch that upstream file (mayhem/
# stays purely additive), this crate re-declares the same harnesses against the root crate's own
# published dependency versions, which DO resolve from crates.io.
[dependencies]
libfuzzer-sys = "0.4.0"
x509-parser = { path = "../..", features = ["validate", "verify"] }

[[bin]]
name = "x509_parse"
path = "fuzz_targets/x509_parse.rs"
test = false
doc = false

[[bin]]
name = "certreq"
path = "fuzz_targets/certreq.rs"
test = false
doc = false

[[bin]]
name = "crl"
path = "fuzz_targets/crl.rs"
test = false
doc = false

# Prevent this from interfering with any parent workspace.
[workspace]
members = ["."]
